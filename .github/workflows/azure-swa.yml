name: Build and deploy (Azure Static Web Apps)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test -- --no-watch --browsers=ChromeHeadless
      - run: npm run build
      # Prerendered HTML, hreflang reciprocity, sitemap URLs -> files (see tools/check-seo.mjs).
      - run: npm run check:seo

      # Preview environments are public URLs; keep drafts out of search results.
      - name: Mark preview builds noindex
        if: github.event_name == 'pull_request'
        run: |
          node -e "const f='dist/deshbhakt/browser/staticwebapp.config.json';const c=JSON.parse(require('fs').readFileSync(f));c.globalHeaders['X-Robots-Tag']='noindex';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Lighthouse budget
        run: npx --yes @lhci/cli@0.14 autorun

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          skip_app_build: true
          app_location: dist/deshbhakt/browser
          api_location: api
          output_location: ''

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
